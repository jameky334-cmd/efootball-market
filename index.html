<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eFootball Market</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .hero {
      background: white;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #00000012;
    }

    .hero h1 {
      margin-top: 0;
    }

    .status {
      display: inline-block;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-top: 8px;
    }

    .online {
      background: #dcfce7;
      color: #166534;
    }

    .offline {
      background: #fee2e2;
      color: #991b1b;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .listings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 2px 10px #00000012;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
      margin: 10px 0;
    }

    .muted {
      color: #6b7280;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #00000080;
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 14px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px;
      margin: 7px 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 14px;
    }

    .user-box {
      font-size: 13px;
      text-align: right;
    }

    @media (max-width: 600px) {
      .nav {
        flex-direction: column;
        align-items: stretch;
      }

      .user-box {
        text-align: left;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">⚽ eFootball Market</div>

    <div class="user-box">
      <div id="userText">ยังไม่ได้เข้าสู่ระบบ</div>
      <div id="roleText"></div>
    </div>

    <div class="row">
      <button class="secondary" onclick="openLogin()">เข้าสู่ระบบ</button>
      <button class="primary" onclick="openRegister()">สมัครสมาชิก</button>
      <button class="danger" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>
</header>

<main>

  <section class="hero">
    <h1>ตลาดซื้อขายไอดี eFootball</h1>
    <p class="muted">
      ตลาดซื้อขายไอดี eFootball พร้อมระบบบัญชี Order และการชำระเงิน
    </p>

    <span id="apiStatus" class="status offline">
      กำลังตรวจสอบ API...
    </span>
  </section>

  <div class="toolbar">
    <button class="primary" onclick="loadListings()">🔄 รีเฟรชรายการ</button>
    <button class="primary" onclick="openSell()">＋ ลงขายไอดี</button>
    <button class="secondary" onclick="loadMyListings()">📦 รายการของฉัน</button>
    <button class="secondary" onclick="loadOrders()">🧾 Orders</button>
  </div>

  <section>
    <h2>ไอดีที่กำลังขาย</h2>
    <div id="listings" class="listings">
      <div class="empty">กำลังโหลด...</div>
    </div>
  </section>

</main>


<!-- LOGIN -->

<div id="loginModal" class="modal">
  <div class="modal-box">

    <h2>เข้าสู่ระบบ</h2>

    <label>อีเมล</label>
    <input id="loginEmail" type="email">

    <label>รหัสผ่าน</label>
    <input id="loginPassword" type="password">

    <div class="row">
      <button class="primary" onclick="login()">เข้าสู่ระบบ</button>
      <button class="secondary" onclick="closeModals()">ปิด</button>
    </div>

  </div>
</div>


<!-- REGISTER -->

<div id="registerModal" class="modal">
  <div class="modal-box">

    <h2>สมัครสมาชิก</h2>

    <label>อีเมล</label>
    <input id="registerEmail" type="email">

    <label>รหัสผ่าน</label>
    <input id="registerPassword" type="password">

    <div class="row">
      <button class="primary" onclick="register()">สมัครสมาชิก</button>
      <button class="secondary" onclick="closeModals()">ปิด</button>
    </div>

  </div>
</div>


<!-- SELL -->

<div id="sellModal" class="modal">
  <div class="modal-box">

    <h2>ลงขายไอดี</h2>

    <label>ชื่อรายการ</label>
    <input id="sellTitle" placeholder="เช่น ไอดีทีมระดับสูง">

    <label>รายละเอียด</label>
    <textarea id="sellDescription"></textarea>

    <label>ราคา (บาท)</label>
    <input id="sellPrice" type="number" min="1">

    <label>ข้อมูลไอดี</label>
    <textarea
      id="sellAccountData"
      placeholder="ข้อมูลเข้าสู่ระบบไอดี จะถูกเก็บอย่างปลอดภัย"
    ></textarea>

    <div class="row">
      <button class="primary" onclick="createListing()">ลงขาย</button>
      <button class="secondary" onclick="closeModals()">ปิด</button>
    </div>

  </div>
</div>


<script>

/* ================================
   API
================================ */

const API_BASE_URL =
  localStorage.getItem("ef_api_base_url") ||
  "https://efootball-market-api.onrender.com";


function getToken() {
  return localStorage.getItem("ef_token") || "";
}


async function api(path, options = {}) {

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  const token = getToken();

  if (token) {
    headers.Authorization = "Bearer " + token;
  }

  const response = await fetch(
    API_BASE_URL + path,
    {
      ...options,
      headers
    }
  );

  const text = await response.text();

  let data = {};

  try {
    data = text ? JSON.parse(text) : {};
  } catch {
    data = {
      message: text
    };
  }

  if (!response.ok) {
    throw new Error(
      data.message ||
      data.error ||
      `HTTP ${response.status}`
    );
  }

  return data;
}


/* ================================
   HEALTH
================================ */

async function checkAPI() {

  const status = document.getElementById("apiStatus");

  try {

    const data = await api("/health");

    if (data.ok) {

      status.textContent =
        "🟢 API ออนไลน์";

      status.className =
        "status online";

    } else {

      throw new Error("API ไม่พร้อมใช้งาน");

    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "🔴 API ออฟไลน์";

    status.className =
      "status offline";

  }
}


/* ================================
   AUTH
================================ */

async function register() {

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  if (!email || !password) {
    alert("กรุณากรอกอีเมลและรหัสผ่าน");
    return;
  }

  try {

    await api(
      "/api/auth/register",
      {
        method: "POST",
        body: JSON.stringify({
          email,
          password
        })
      }
    );

    alert("สมัครสมาชิกสำเร็จ");

    closeModals();

    openLogin();

  } catch (error) {

    alert(error.message);

  }
}


async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!email || !password) {
    alert("กรุณากรอกข้อมูลให้ครบ");
    return;
  }

  try {

    const data =
      await api(
        "/api/auth/login",
        {
          method: "POST",
          body: JSON.stringify({
            email,
            password
          })
        }
      );

    if (!data.token) {
      throw new Error("API ไม่ส่ง Token กลับมา");
    }

    localStorage.setItem(
      "ef_token",
      data.token
    );

    closeModals();

    await loadMe();

    alert("เข้าสู่ระบบสำเร็จ");

  } catch (error) {

    alert(error.message);

  }
}


async function loadMe() {

  const token = getToken();

  const userText =
    document.getElementById("userText");

  const roleText =
    document.getElementById("roleText");

  if (!token) {

    userText.textContent =
      "ยังไม่ได้เข้าสู่ระบบ";

    roleText.textContent =
      "";

    return;

  }

  try {

    const data =
      await api("/api/me");

    const user =
      data.user || data;

    userText.textContent =
      user.email || "เข้าสู่ระบบแล้ว";

    roleText.textContent =
      "สิทธิ์: " +
      (user.role || "buyer");

  } catch (error) {

    console.error(error);

    localStorage.removeItem("ef_token");

    userText.textContent =
      "ยังไม่ได้เข้าสู่ระบบ";

    roleText.textContent =
      "";

  }
}


function logout() {

  localStorage.removeItem("ef_token");

  loadMe();

  alert("ออกจากระบบแล้ว");

}


/* ================================
   LISTINGS
================================ */

async function loadListings() {

  const container =
    document.getElementById("listings");

  container.innerHTML =
    `<div class="empty">กำลังโหลด...</div>`;

  try {

    const data =
      await api("/api/listings");

    const listings =
      Array.isArray(data)
        ? data
        : (
            data.listings ||
            data.items ||
            []
          );

    if (!listings.length) {

      container.innerHTML =
        `<div class="empty">
          ยังไม่มีรายการขาย
        </div>`;

      return;
    }

    container.innerHTML =
      listings
        .map(renderListing)
        .join("");

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        โหลดรายการไม่ได้<br>
        <small>${escapeHTML(error.message)}</small>
      </div>`;

  }
}


function renderListing(item) {

  const id =
    item.id;

  const title =
    item.title ||
    item.name ||
    "eFootball Account";

  const description =
    item.description ||
    "ไม่มีรายละเอียด";

  const price =
    Number(item.price || 0);

  return `
    <div class="card">

      <h3>
        ${escapeHTML(title)}
      </h3>

      <p class="muted">
        ${escapeHTML(description)}
      </p>

      <div class="price">
        ฿${price.toLocaleString("th-TH")}
      </div>

      <button
        class="primary"
        onclick="createOrder('${id}')"
      >
        🛒 ซื้อไอดี
      </button>

    </div>
  `;
}


/* ================================
   SELL
================================ */

function openSell() {

  if (!getToken()) {

    alert(
      "กรุณาเข้าสู่ระบบก่อนลงขาย"
    );

    openLogin();

    return;
  }

  openModal("sellModal");

}


async function createListing() {

  const title =
    document.getElementById("sellTitle")
      .value.trim();

  const description =
    document.getElementById("sellDescription")
      .value.trim();

  const price =
    Number(
      document.getElementById("sellPrice")
        .value
    );

  const accountData =
    document.getElementById("sellAccountData")
      .value;

  if (!title || !price || !accountData) {

    alert(
      "กรุณากรอกชื่อ ราคา และข้อมูลไอดี"
    );

    return;
  }

  try {

    await api(
      "/api/listings",
      {
        method: "POST",
        body: JSON.stringify({
          title,
          description,
          price,
          account_data: accountData
        })
      }
    );

    alert("ลงขายสำเร็จ");

    closeModals();

    await loadListings();

  } catch (error) {

    alert(error.message);

  }

}


/* ================================
   ORDER
================================ */

async function createOrder(listingId) {

  if (!getToken()) {

    alert(
      "กรุณาเข้าสู่ระบบก่อนซื้อ"
    );

    openLogin();

    return;
  }

  if (
    !confirm(
      "ต้องการสร้าง Order สำหรับรายการนี้หรือไม่?"
    )
  ) {
    return;
  }

  try {

    const data =
      await api(
        "/api/orders",
        {
          method: "POST",
          body: JSON.stringify({
            listing_id: listingId
          })
        }
      );

    alert(
      "สร้าง Order สำเร็จ\nOrder ID: " +
      (data.order?.id ||
       data.id ||
       "-")
    );

  } catch (error) {

    alert(error.message);

  }

}


/* ================================
   MY LISTINGS
================================ */

async function loadMyListings() {

  if (!getToken()) {

    alert(
      "กรุณาเข้าสู่ระบบก่อน"
    );

    openLogin();

    return;
  }

  try {

    const data =
      await api(
        "/api/my-listings"
      );

    const items =
      Array.isArray(data)
        ? data
        : (
            data.listings ||
            data.items ||
            []
          );

    const container =
      document.getElementById("listings");

    if (!items.length) {

      container.innerHTML =
        `<div class="empty">
          ยังไม่มีรายการของคุณ
        </div>`;

      return;
    }

    container.innerHTML =
      items
        .map(renderListing)
        .join("");

  } catch (error) {

    alert(error.message);

  }

}


/* ================================
   ORDERS
================================ */

async function loadOrders() {

  if (!getToken()) {

    alert(
      "กรุณาเข้าสู่ระบบก่อน"
    );

    openLogin();

    return;
  }

  try {

    const data =
      await api("/api/orders");

    const orders =
      Array.isArray(data)
        ? data
        : (
            data.orders ||
            data.items ||
            []
          );

    const container =
      document.getElementById("listings");

    if (!orders.length) {

      container.innerHTML =
        `<div class="empty">
          ยังไม่มี Order
        </div>`;

      return;
    }

    container.innerHTML =
      orders
        .map(order => `

          <div class="card">

            <h3>
              Order #${escapeHTML(
                String(order.id || "")
              )}
            </h3>

            <p>
              สถานะ:
              <strong>
                ${escapeHTML(
                  order.status || "-"
                )}
              </strong>
            </p>

            <p>
              การชำระเงิน:
              ${escapeHTML(
                order.payment_status || "-"
              )}
            </p>

            ${
              (
                order.payment_status === "paid" ||
                order.status === "paid" ||
                order.status === "completed"
              )
              ? `
                <button
                  class="primary"
                  onclick="getDelivery('${order.id}')"
                >
                  🔐 รับข้อมูลไอดี
                </button>
              `
              : ""
            }

          </div>

        `)
        .join("");

  } catch (error) {

    alert(error.message);

  }

}


/* ================================
   DELIVERY
================================ */

async function getDelivery(orderId) {

  if (
    !confirm(
      "ต้องการรับข้อมูลไอดีหรือไม่?"
    )
  ) {
    return;
  }

  try {

    const data =
      await api(
        `/api/orders/${orderId}/delivery`
      );

    const delivery =
      data.delivery ||
      data.account_data ||
      data;

    alert(
      "ข้อมูลไอดี:\n\n" +
      JSON.stringify(
        delivery,
        null,
        2
      )
    );

  } catch (error) {

    alert(error.message);

  }

}


/* ================================
   MODAL
================================ */

function openModal(id) {

  document
    .getElementById(id)
    .classList
    .add("active");

}


function closeModals() {

  document
    .querySelectorAll(".modal")
    .forEach(
      modal =>
        modal.classList.remove("active")
    );

}


function openLogin() {

  closeModals();

  openModal("loginModal");

}


function openRegister() {

  closeModals();

  openModal("registerModal");

}


/* ================================
   SECURITY / HTML
================================ */

function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ================================
   START
================================ */

async function start() {

  await checkAPI();

  await loadMe();

  await loadListings();

}


start();

</script>

</body>
</html>
